name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build dinput8.dll
        shell: cmd
        run: build.cmd
      - name: Check script reads main.cpp
        run: python tools/check_exe.py --parse-only
      - name: No unripe growth stage in templates.txt
        run: python tools/growth_stages.py
