name: release

# A tag like v1.1.8-fix1 builds dinput8.dll from this public source and makes a draft release.
# The draft is published by hand after a look.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build dinput8.dll
        shell: cmd
        run: build.cmd
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/dinput8.dll dist
          Copy-Item LICENSE.txt dist/AutoLootPlus-LICENSE.txt
          Copy-Item native/third_party/imgui/LICENSE.txt dist/DearImGui-LICENSE.txt
          Copy-Item native/third_party/vulkan/LICENSE.md dist/Vulkan-Headers-LICENSE.md
          Push-Location dist
          # Unix line ends, so `sha256sum -c SHA256SUMS.txt` reads it on any system
          $sums = Get-ChildItem dinput8.dll |
            ForEach-Object { "{0}  {1}`n" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", -join $sums)
          Get-Content SHA256SUMS.txt
          Pop-Location
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/dinput8.dll
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "Auto Loot Plus ${{ github.ref_name }} (unofficial patch)" `
            --notes "Built by GitHub Actions from this tag. Check the SHA-256 in SHA256SUMS.txt, or run: gh attestation verify dinput8.dll --repo ${{ github.repository }}" `
            dist/dinput8.dll dist/SHA256SUMS.txt dist/AutoLootPlus-LICENSE.txt dist/DearImGui-LICENSE.txt dist/Vulkan-Headers-LICENSE.md
